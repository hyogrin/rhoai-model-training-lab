# LoRA Fine-Tuning Profile
# Applied via training_hub.lora_sft

training:
  method: "lora_sft"
  seed: 42

model:
  model_id: "Qwen/Qwen3-4B-Instruct-2507"
  model_revision: "main"
  tokenizer_id: "Qwen/Qwen3-4B-Instruct-2507"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/prepared/tau-knowledge-v1/training/lora/train.jsonl"
  validation_file: "data/prepared/tau-knowledge-v1/training/lora/validation.jsonl"
  max_seq_length: 4096
  loss_masking: "assistant_only"

training_args:
  output_dir: "checkpoints/lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 2
  report_to: "none"  # MLflow handled separately
  resume_from_checkpoint: true

# Hardware overrides (uncomment and adjust for your GPU)
# hardware_overrides:
#   A100_40GB:
#     per_device_train_batch_size: 4
#     gradient_accumulation_steps: 4
#   T4_16GB:
#     per_device_train_batch_size: 1
#     gradient_accumulation_steps: 16
#     max_seq_length: 2048

export:
  adapter_path: "models/lora-adapter"
  merged_path: "models/lora-merged"
  save_adapter_separately: true
  save_merged: true
  validate_reload: true
