[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhoai-model-training-lab"
version = "0.1.0"
description = "RHOAI 3.5 τ-Knowledge banking model training lab — LoRA, OSFT, RAG, and evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "RHOAI Lab Team" }]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
sdg = [
    "sdg_hub>=0.1",
    "openai>=1.30",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@v1.0.1",
]
lora = [
    "training_hub[lora]>=0.1",
    "torch>=2.14",
    "transformers>=5.17",
    "peft>=0.21",
    "datasets>=5.0",
    "accelerate>=1.15",
    "bitsandbytes>=0.45",
    "trl>=1.13",
]
osft = [
    "training_hub>=0.1",
    "torch>=2.14",
    "transformers>=5.17",
    "datasets>=5.0",
    "accelerate>=1.15",
]
backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "chromadb>=0.5",
    "numpy>=1.26",
]
eval = [
    "mlflow>=2.14",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "openai>=1.30",
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@v1.0.1",
]
all = [
    "rhoai-model-training-lab[sdg,lora,osft,backend,eval]",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rhoai-lab = "rhoai_model_training_lab.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rhoai_model_training_lab"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
warn_return_any = true
warn_unused_configs = true
